<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#185FA5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>오늘의 할 일</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: #f0f4f8; font-family: -apple-system, 'Noto Sans KR', sans-serif; }

#loading-overlay { position: fixed; inset: 0; background: #185FA5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 999; }
#loading-overlay.hidden { display: none; }
.lo-icon { font-size: 52px; color: #E6F1FB; }
.lo-text { font-size: 15px; color: #B5D4F4; }

.wrap { max-width: 480px; margin: 0 auto; padding: 14px 13px 100px; }

.sync-bar { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 4px 12px; border-radius: 99px; margin-bottom: 10px; }
.sync-bar.synced  { background: #E1F5EE; color: #0F6E56; }
.sync-bar.syncing { background: #E6F1FB; color: #185FA5; }
.sync-bar.offline { background: #FAECE7; color: #993C1D; }
.sync-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.sync-bar.synced  .sync-dot { background: #1D9E75; }
.sync-bar.syncing .sync-dot { background: #185FA5; animation: blink 1s infinite; }
.sync-bar.offline .sync-dot { background: #D85A30; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

.header { background: #185FA5; border-radius: 24px; padding: 18px 20px 14px; margin-bottom: 13px; }
.header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.date-lbl { font-size: 12px; color: #85B7EB; margin-bottom: 4px; }
.title { font-size: 20px; font-weight: 700; color: #E6F1FB; display: flex; align-items: center; gap: 8px; }
.tab-btns { display: flex; gap: 5px; }
.tab-btn { flex: 1; font-size: 12px; padding: 8px 5px; border-radius: 99px; border: 1.5px solid #85B7EB; background: transparent; color: #B5D4F4; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 4px; }
.tab-btn.active { background: #E6F1FB; color: #0C447C; border-color: #E6F1FB; font-weight: 700; }

.stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 13px; }
.stat { border-radius: 20px; padding: 12px 10px; }
.stat .num { font-size: 24px; font-weight: 700; }
.stat .lbl { font-size: 11px; margin-top: 2px; }
.stat.blue  { background: #E6F1FB; } .stat.blue  .num { color: #0C447C; } .stat.blue  .lbl { color: #185FA5; }
.stat.green { background: #E1F5EE; } .stat.green .num { color: #085041; } .stat.green .lbl { color: #0F6E56; }
.stat.coral { background: #FAECE7; } .stat.coral .num { color: #712B13; } .stat.coral .lbl { color: #993C1D; }

.add-row { display: flex; gap: 8px; margin-bottom: 13px; }
.add-row input { flex: 1; height: 46px; border-radius: 99px; border: 1.5px solid #B5D4F4; background: #fff; color: #1a1a1a; padding: 0 18px; font-size: 15px; outline: none; font-family: inherit; }
.add-row input:focus { border-color: #378ADD; box-shadow: 0 0 0 3px rgba(53,138,221,.15); }
.add-btn { height: 46px; min-width: 46px; padding: 0 18px; border-radius: 99px; border: none; background: #185FA5; color: #E6F1FB; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.add-btn:active { background: #0C447C; transform: scale(.96); }

.section-lbl { font-size: 11px; font-weight: 700; color: #888780; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }

.task-list { display: flex; flex-direction: column; gap: 10px; }
.task-card { border-radius: 20px; padding: 14px 15px; border: 2px solid transparent; }
.task-card.pending { border-color: #B5D4F4; background: #fff; }
.task-card.done    { border-color: #9FE1CB; background: #E1F5EE; }
.task-card.missed  { border-color: #F5C4B3; background: #FAECE7; }

.task-top { display: flex; align-items: center; gap: 10px; }
.task-icon { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; }
.task-card.pending .task-icon { background: #E6F1FB; color: #185FA5; }
.task-card.done    .task-icon { background: #1D9E75; color: #E1F5EE; }
.task-card.missed  .task-icon { background: #D85A30; color: #FAECE7; }
.task-text { flex: 1; font-size: 15px; color: #1a1a1a; line-height: 1.4; }
.task-card.done   .task-text { text-decoration: line-through; color: #0F6E56; }
.task-card.missed .task-text { color: #712B13; }

.badge { font-size: 11px; padding: 3px 10px; border-radius: 99px; font-weight: 700; white-space: nowrap; }
.badge.pending { background: #E6F1FB; color: #185FA5; }
.badge.done    { background: #1D9E75; color: #E1F5EE; }
.badge.missed  { background: #D85A30; color: #FAECE7; }

.btn-row { display: flex; gap: 6px; margin-top: 10px; align-items: center; padding-left: 44px; flex-wrap: wrap; }
.action-btn { font-size: 12px; padding: 6px 13px; border-radius: 99px; cursor: pointer; display: flex; align-items: center; gap: 4px; font-family: inherit; }
.btn-complete { border: 1.5px solid #1D9E75; background: #E1F5EE; color: #085041; }
.btn-complete:active { background: #9FE1CB; }
.btn-fail { border: 1.5px solid #D85A30; background: #FAECE7; color: #712B13; }
.btn-fail:active { background: #F5C4B3; }
.btn-edit { border: 1.5px solid #185FA5; background: #E6F1FB; color: #0C447C; }
.btn-edit:active { background: #B5D4F4; }
.btn-del { border: 1px solid #ccc; background: #f5f5f5; color: #666; }
.btn-del:active { background: #FCEBEB; border-color: #F09595; color: #A32D2D; }
.undo-link { font-size: 12px; color: #185FA5; cursor: pointer; text-decoration: underline; padding: 4px 0; background: none; border: none; font-family: inherit; }

.edit-box { margin-top: 10px; padding: 12px 13px; background: #f0f4f8; border-radius: 16px; border: 1.5px solid #B5D4F4; }
.edit-box-title { font-size: 12px; color: #185FA5; font-weight: 700; display: flex; align-items: center; gap: 5px; margin-bottom: 8px; }
.edit-input-row { display: flex; gap: 7px; }
.edit-text-input { flex: 1; height: 42px; border-radius: 99px; border: 1.5px solid #B5D4F4; background: #fff; color: #1a1a1a; padding: 0 15px; font-size: 14px; outline: none; font-family: inherit; }
.edit-text-input:focus { border-color: #378ADD; }
.edit-save { height: 42px; padding: 0 15px; border-radius: 99px; border: none; background: #185FA5; color: #E6F1FB; font-size: 13px; cursor: pointer; font-family: inherit; white-space: nowrap; display: flex; align-items: center; gap: 4px; font-weight: 700; }
.edit-cancel { height: 42px; padding: 0 12px; border-radius: 99px; border: 1px solid #ccc; background: #fff; color: #666; font-size: 13px; cursor: pointer; font-family: inherit; }

.reason-box { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; padding-left: 44px; }
.reason-input { width: 100%; height: 62px; border-radius: 16px; border: 1.5px solid #F0997B; background: #fff; color: #1a1a1a; padding: 9px 13px; font-size: 14px; resize: none; outline: none; font-family: inherit; }
.reason-submit { align-self: flex-end; font-size: 12px; padding: 6px 16px; border-radius: 99px; border: none; background: #D85A30; color: #FAECE7; cursor: pointer; font-family: inherit; font-weight: 700; }
.reason-display { font-size: 12px; color: #712B13; background: #F5C4B3; border-radius: 14px; padding: 8px 13px; margin-top: 8px; margin-left: 44px; display: flex; align-items: flex-start; gap: 5px; line-height: 1.4; }

.empty { text-align: center; padding: 2.5rem 1rem; color: #888; font-size: 14px; border: 1.5px dashed #B5D4F4; border-radius: 24px; background: #E6F1FB; }
.empty i { font-size: 32px; color: #378ADD; display: block; margin-bottom: 8px; }

.past-panel { display: flex; flex-direction: column; gap: 12px; }
.date-nav { display: flex; align-items: center; gap: 6px; background: #E6F1FB; border-radius: 99px; padding: 6px 8px; }
.nav-btn { width: 34px; height: 34px; border-radius: 50%; border: none; background: #fff; color: #185FA5; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.nav-btn:disabled { opacity: .3; }
.chip-scroll { display: flex; gap: 6px; flex: 1; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding: 2px 0; }
.chip-scroll::-webkit-scrollbar { display: none; }
.date-chip { font-size: 12px; padding: 5px 13px; border-radius: 99px; border: 1.5px solid #B5D4F4; background: #fff; color: #185FA5; cursor: pointer; white-space: nowrap; font-family: inherit; flex-shrink: 0; }
.date-chip.selected { background: #185FA5; color: #E6F1FB; border-color: #185FA5; font-weight: 700; }

.past-day-card { background: #fff; border: 1.5px solid #B5D4F4; border-radius: 24px; padding: 17px; }
.past-day-title { font-size: 15px; font-weight: 700; color: #1a1a1a; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.mini-bar { height: 10px; background: #FAECE7; border-radius: 99px; overflow: hidden; display: flex; margin-bottom: 12px; }
.mini-done{background:#1D9E75;} .mini-miss{background:#D85A30;} .mini-pend{background:#B5D4F4;}
.past-task { border-radius: 14px; padding: 10px 13px; display: flex; align-items: flex-start; gap: 10px; margin-bottom: 7px; }
.past-task.done{background:#E1F5EE;} .past-task.missed{background:#FAECE7;} .past-task.pending{background:#f5f5f5;}
.pt-icon { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
.past-task.done   .pt-icon{background:#1D9E75;color:#E1F5EE;}
.past-task.missed .pt-icon{background:#D85A30;color:#FAECE7;}
.past-task.pending .pt-icon{background:#B5D4F4;color:#185FA5;}
.pt-text { font-size: 14px; color: #1a1a1a; line-height: 1.4; }
.past-task.done   .pt-text{text-decoration:line-through;color:#0F6E56;}
.past-task.missed .pt-text{color:#712B13;}
.pt-reason { font-size: 12px; color: #993C1D; background: #F5C4B3; border-radius: 10px; padding: 3px 10px; display: inline-block; margin-top: 4px; }

.history-panel { display: flex; flex-direction: column; gap: 12px; }
.stat-card { background: #fff; border: 1.5px solid #B5D4F4; border-radius: 24px; padding: 18px; }
.stat-card-title { font-size: 15px; font-weight: 700; color: #1a1a1a; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.ov-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 14px; }
.ov-item { border-radius: 16px; padding: 12px 10px; }
.ov-item .n{font-size:20px;font-weight:700;} .ov-item .l{font-size:11px;margin-top:2px;}
.ov-item.blue{background:#E6F1FB;} .ov-item.blue .n{color:#0C447C;} .ov-item.blue .l{color:#185FA5;}
.ov-item.green{background:#E1F5EE;} .ov-item.green .n{color:#085041;} .ov-item.green .l{color:#0F6E56;}
.ov-item.coral{background:#FAECE7;} .ov-item.coral .n{color:#712B13;} .ov-item.coral .l{color:#993C1D;}
.bar-labels{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;font-weight:700;}
.bar-lbl-done{color:#0F6E56;} .bar-lbl-miss{color:#993C1D;}
.bar-track{height:22px;background:#FAECE7;border-radius:99px;overflow:hidden;display:flex;}
.bar-done{background:#1D9E75;border-radius:99px 0 0 99px;display:flex;align-items:center;justify-content:center;}
.bar-done.full{border-radius:99px;}
.bar-miss{background:#D85A30;flex:1;border-radius:0 99px 99px 0;}
.bar-pct{font-size:11px;color:#E1F5EE;font-weight:700;padding:0 8px;white-space:nowrap;}
.leg-row{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:8px;}
.leg-row span{display:flex;align-items:center;gap:4px;color:#666;}
.leg-sq{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.no-data{text-align:center;padding:2.5rem;color:#888;font-size:14px;border:1.5px dashed #ccc;border-radius:24px;}
.no-data i{font-size:28px;display:block;margin-bottom:8px;}

.panel{display:none;} .panel.active{display:block;}
</style>
</head>
<body>

<div id="loading-overlay">
  <i class="ti ti-checklist lo-icon"></i>
  <div class="lo-text">할 일 불러오는 중...</div>
</div>

<div class="wrap">
  <div class="sync-bar syncing" id="sync-bar">
    <div class="sync-dot"></div>
    <span id="sync-text">연결 중...</span>
  </div>

  <div class="header">
    <div class="header-top">
      <div>
        <div class="date-lbl" id="date-label"></div>
        <div class="title"><i class="ti ti-checklist"></i> 오늘의 할 일</div>
      </div>
      <div class="tab-btns">
        <button class="tab-btn active" id="tab-today" onclick="switchTab('today')"><i class="ti ti-calendar-today" style="font-size:13px"></i> 오늘</button>
        <button class="tab-btn" id="tab-past"  onclick="switchTab('past')"><i class="ti ti-history" style="font-size:13px"></i> 과거</button>
        <button class="tab-btn" id="tab-stats" onclick="switchTab('stats')"><i class="ti ti-chart-bar" style="font-size:13px"></i> 통계</button>
      </div>
    </div>
  </div>

  <div id="panel-today" class="panel active">
    <div class="stats">
      <div class="stat blue" ><div class="num" id="s-total">0</div><div class="lbl"><i class="ti ti-list"></i> 전체</div></div>
      <div class="stat green"><div class="num" id="s-done">0</div><div class="lbl"><i class="ti ti-circle-check"></i> 완료</div></div>
      <div class="stat coral"><div class="num" id="s-miss">0</div><div class="lbl"><i class="ti ti-circle-x"></i> 미완료</div></div>
    </div>
    <div class="add-row">
      <input type="text" id="task-input" placeholder="새 할 일을 입력하세요..." maxlength="80" />
      <button class="add-btn" onclick="addTask()"><i class="ti ti-plus"></i></button>
    </div>
    <div class="section-lbl"><i class="ti ti-layout-list"></i> 할 일 목록</div>
    <div class="task-list" id="task-list"></div>
  </div>

  <div id="panel-past" class="panel">
    <div class="past-panel" id="past-panel"></div>
  </div>

  <div id="panel-stats" class="panel">
    <div class="history-panel" id="history-panel"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyASLzvLCiAP5taMfAK2EqlSKA6IuQoSOzc",
  authDomain: "my-todo-app-8bc6f.firebaseapp.com",
  databaseURL: "https://my-todo-app-8bc6f-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "my-todo-app-8bc6f",
  storageBucket: "my-todo-app-8bc6f.firebasestorage.app",
  messagingSenderId: "523916936503",
  appId: "1:523916936503:web:57fec3008c60bd6e24c6b2"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const DAYS = ['일','월','화','수','목','금','토'];
const now = new Date();
const todayKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

document.getElementById('date-label').textContent =
  `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 (${DAYS[now.getDay()]}요일)`;

let allData = {};
let showReasonFor = null;
let editingId = null;
let selectedPastKey = null;
let chartInst = null;
let currentTab = 'today';

function setSyncStatus(s) {
  const bar = document.getElementById('sync-bar');
  const txt = document.getElementById('sync-text');
  bar.className = 'sync-bar ' + s;
  txt.textContent = s === 'synced' ? '동기화 완료' : s === 'syncing' ? '동기화 중...' : '오프라인';
}

const dataRef = ref(db, 'personal_todos');
onValue(dataRef, snap => {
  allData = snap.val() || {};
  if (!allData[todayKey]) allData[todayKey] = [];
  document.getElementById('loading-overlay').classList.add('hidden');
  setSyncStatus('synced');
  if (currentTab === 'today') renderToday();
  else if (currentTab === 'past') renderPast();
  else renderStats();
}, () => {
  setSyncStatus('offline');
  document.getElementById('loading-overlay').classList.add('hidden');
});

async function persist() {
  setSyncStatus('syncing');
  try { await set(dataRef, allData); setSyncStatus('synced'); }
  catch(e) { setSyncStatus('offline'); }
}

function getTasks() { return allData[todayKey] || []; }
function setTasks(arr) { allData[todayKey] = arr; }

window.addTask = async function() {
  const inp = document.getElementById('task-input');
  const text = inp.value.trim();
  if (!text) return;
  const tasks = getTasks();
  tasks.push({ id: Date.now(), text, status: 'pending', reason: '' });
  setTasks(tasks);
  inp.value = ''; inp.blur();
  renderToday(); await persist();
};
document.getElementById('task-input').addEventListener('keydown', e => { if (e.key === 'Enter') window.addTask(); });

window.markDone = async function(id) {
  const tasks = getTasks();
  const t = tasks.find(t => t.id === id); if (!t) return;
  t.status = 'done'; t.reason = '';
  if (showReasonFor === id) showReasonFor = null;
  if (editingId === id) editingId = null;
  setTasks(tasks); renderToday(); await persist();
};
window.markFail = function(id) {
  if (editingId === id) editingId = null;
  showReasonFor = showReasonFor === id ? null : id;
  renderToday();
};
window.submitReason = async function(id) {
  const el = document.getElementById('reason-' + id);
  const tasks = getTasks();
  const t = tasks.find(t => t.id === id); if (!t) return;
  t.status = 'missed'; t.reason = (el?.value || '').trim() || '이유 없음';
  showReasonFor = null; setTasks(tasks); renderToday(); await persist();
};
window.undoTask = async function(id) {
  const tasks = getTasks();
  const t = tasks.find(t => t.id === id); if (!t) return;
  t.status = 'pending'; t.reason = '';
  setTasks(tasks); renderToday(); await persist();
};
window.deleteTask = async function(id) {
  setTasks(getTasks().filter(t => t.id !== id));
  if (showReasonFor === id) showReasonFor = null;
  if (editingId === id) editingId = null;
  renderToday(); await persist();
};
window.startEdit = function(id) {
  showReasonFor = null;
  editingId = editingId === id ? null : id;
  renderToday();
  if (editingId === id) setTimeout(() => {
    const inp = document.getElementById('edit-input-' + id);
    if (inp) { inp.focus(); inp.select(); }
  }, 30);
};
window.saveEdit = async function(id) {
  const inp = document.getElementById('edit-input-' + id);
  const newText = inp?.value.trim(); if (!newText) return;
  const tasks = getTasks();
  const t = tasks.find(t => t.id === id); if (!t) return;
  t.text = newText; editingId = null;
  setTasks(tasks); renderToday(); await persist();
};
window.cancelEdit = function() { editingId = null; renderToday(); };

function renderToday() {
  const tasks = getTasks();
  const list = document.getElementById('task-list');
  const done = tasks.filter(t => t.status === 'done').length;
  const miss = tasks.filter(t => t.status === 'missed').length;
  document.getElementById('s-total').textContent = tasks.length;
  document.getElementById('s-done').textContent = done;
  document.getElementById('s-miss').textContent = miss;

  if (tasks.length === 0) {
    list.innerHTML = '<div class="empty"><i class="ti ti-mood-smile"></i>할 일을 추가해 보세요!</div>';
    return;
  }
  const iconMap = { pending:'ti-clock', done:'ti-check', missed:'ti-x' };
  list.innerHTML = tasks.map(t => {
    const showReason = showReasonFor === t.id && t.status === 'pending';
    const isEditing  = editingId === t.id;
    const badge = t.status === 'done'
      ? '<span class="badge done"><i class="ti ti-check" style="font-size:10px"></i> 완료</span>'
      : t.status === 'missed'
      ? '<span class="badge missed"><i class="ti ti-x" style="font-size:10px"></i> 미완료</span>'
      : '<span class="badge pending"><i class="ti ti-clock" style="font-size:10px"></i> 진행중</span>';
    let btns = t.status === 'pending'
      ? `<button class="action-btn btn-complete" onclick="markDone(${t.id})"><i class="ti ti-check"></i> 완료</button>
         <button class="action-btn btn-fail"     onclick="markFail(${t.id})"><i class="ti ti-x"></i> 미완료</button>
         <button class="action-btn btn-edit"     onclick="startEdit(${t.id})"><i class="ti ti-edit"></i> 수정</button>
         <button class="action-btn btn-del"      onclick="deleteTask(${t.id})"><i class="ti ti-trash"></i></button>`
      : `<button class="undo-link" onclick="undoTask(${t.id})"><i class="ti ti-rotate-left" style="font-size:12px;vertical-align:-1px"></i> 되돌리기</button>
         <button class="action-btn btn-edit" onclick="startEdit(${t.id})"><i class="ti ti-edit"></i> 수정</button>
         <button class="action-btn btn-del"  onclick="deleteTask(${t.id})"><i class="ti ti-trash"></i></button>`;
    const editBox = isEditing ? `
      <div class="edit-box">
        <div class="edit-box-title"><i class="ti ti-edit"></i> 할 일 수정</div>
        <div class="edit-input-row">
          <input class="edit-text-input" type="text" id="edit-input-${t.id}"
            value="${t.text.replace(/"/g,'&quot;')}" maxlength="80"
            onkeydown="if(event.key==='Enter')saveEdit(${t.id});else if(event.key==='Escape')cancelEdit();" />
          <button class="edit-save"   onclick="saveEdit(${t.id})"><i class="ti ti-device-floppy"></i> 저장</button>
          <button class="edit-cancel" onclick="cancelEdit()">취소</button>
        </div>
      </div>` : '';
    const reasonSection = showReason
      ? `<div class="reason-box"><textarea class="reason-input" id="reason-${t.id}" placeholder="완료하지 못한 이유를 입력하세요..."></textarea><button class="reason-submit" onclick="submitReason(${t.id})">저장</button></div>`
      : (t.reason ? `<div class="reason-display"><i class="ti ti-message-circle" style="font-size:13px;flex-shrink:0;margin-top:1px"></i>${t.reason}</div>` : '');
    return `<div class="task-card ${t.status}">
      <div class="task-top">
        <div class="task-icon"><i class="ti ${iconMap[t.status]}"></i></div>
        <span class="task-text">${t.text}</span>${badge}
      </div>
      <div class="btn-row">${btns}</div>
      ${editBox}${reasonSection}
    </div>`;
  }).join('');
}

function renderPast() {
  const panel = document.getElementById('past-panel');
  const pastKeys = Object.keys(allData).filter(k => k !== todayKey).sort().reverse();
  if (pastKeys.length === 0) {
    panel.innerHTML = '<div class="no-data"><i class="ti ti-clock"></i>아직 과거 기록이 없어요.</div>';
    return;
  }
  if (!selectedPastKey || !allData[selectedPastKey]) selectedPastKey = pastKeys[0];
  const chipHtml = pastKeys.map(k => {
    const [,m,d] = k.split('-');
    return `<button class="date-chip ${k===selectedPastKey?'selected':''}" onclick="selectPastDay('${k}')">${parseInt(m)}/${parseInt(d)}</button>`;
  }).join('');
  const arr = allData[selectedPastKey] || [];
  const d=arr.filter(t=>t.status==='done').length, m=arr.filter(t=>t.status==='missed').length;
  const p=arr.filter(t=>t.status==='pending').length, total=arr.length;
  const dPct=total>0?Math.round(d/total*100):0, mPct=total>0?Math.round(m/total*100):0, pPct=100-dPct-mPct;
  const [yr,mo,dy] = selectedPastKey.split('-');
  const dateObj = new Date(parseInt(yr),parseInt(mo)-1,parseInt(dy));
  const dayLabel = `${parseInt(yr)}년 ${parseInt(mo)}월 ${parseInt(dy)}일 (${DAYS[dateObj.getDay()]}요일)`;
  const curIdx = pastKeys.indexOf(selectedPastKey);
  const iconMap = { pending:'ti-clock', done:'ti-check', missed:'ti-x' };
  const taskListHtml = arr.length === 0
    ? '<div style="color:#888;font-size:14px;padding:1rem;text-align:center">이 날은 할 일이 없었어요</div>'
    : arr.map(t => `
      <div class="past-task ${t.status}">
        <div class="pt-icon"><i class="ti ${iconMap[t.status]}"></i></div>
        <div>
          <div class="pt-text">${t.text}</div>
          ${t.reason?`<div class="pt-reason"><i class="ti ti-message-circle" style="font-size:11px;vertical-align:-1px"></i> ${t.reason}</div>`:''}
        </div>
      </div>`).join('');
  panel.innerHTML = `
    <div class="date-nav">
      <button class="nav-btn" onclick="navPastDay(1)" ${curIdx>=pastKeys.length-1?'disabled':''}><i class="ti ti-chevron-left"></i></button>
      <div class="chip-scroll">${chipHtml}</div>
      <button class="nav-btn" onclick="navPastDay(-1)" ${curIdx<=0?'disabled':''}><i class="ti ti-chevron-right"></i></button>
    </div>
    <div class="past-day-card">
      <div class="past-day-title"><i class="ti ti-calendar-event"></i> ${dayLabel}</div>
      <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;">
        <span style="font-size:12px;background:#E1F5EE;color:#085041;padding:3px 11px;border-radius:99px;font-weight:700;"><i class="ti ti-check" style="font-size:11px"></i> 완료 ${d}</span>
        <span style="font-size:12px;background:#FAECE7;color:#712B13;padding:3px 11px;border-radius:99px;font-weight:700;"><i class="ti ti-x" style="font-size:11px"></i> 미완료 ${m}</span>
        ${p>0?`<span style="font-size:12px;background:#E6F1FB;color:#0C447C;padding:3px 11px;border-radius:99px;font-weight:700;"><i class="ti ti-clock" style="font-size:11px"></i> 진행중 ${p}</span>`:''}
        <span style="font-size:12px;background:#f5f5f5;color:#666;padding:3px 11px;border-radius:99px;">총 ${total}개</span>
      </div>
      ${total>0?`<div class="mini-bar"><div class="mini-done" style="width:${dPct}%"></div><div class="mini-miss" style="width:${mPct}%"></div><div class="mini-pend" style="width:${pPct}%"></div></div>`:''}
      <div>${taskListHtml}</div>
    </div>`;
  setTimeout(()=>{ document.querySelector('.date-chip.selected')?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'}); }, 50);
}

window.selectPastDay = k => { selectedPastKey=k; renderPast(); };
window.navPastDay = dir => {
  const keys = Object.keys(allData).filter(k=>k!==todayKey).sort().reverse();
  const next = keys.indexOf(selectedPastKey)+dir;
  if (next>=0&&next<keys.length) { selectedPastKey=keys[next]; renderPast(); }
};

function renderStats() {
  const panel = document.getElementById('history-panel');
  const sortedDays = Object.keys(allData).sort();
  let totalAll=0, doneAll=0, missAll=0;
  sortedDays.forEach(k => {
    const arr = allData[k]||[];
    totalAll+=arr.length;
    doneAll+=arr.filter(t=>t.status==='done').length;
    missAll+=arr.filter(t=>t.status==='missed').length;
  });
  const finishedAll=doneAll+missAll;
  const donePct=finishedAll>0?Math.round(doneAll/finishedAll*100):0;
  const missPct=finishedAll>0?100-donePct:0;
  const recentDays=sortedDays.slice(-14);
  const chartLabels=recentDays.map(k=>{const[,m,d]=k.split('-');return`${parseInt(m)}/${parseInt(d)}`;});
  const chartDone=recentDays.map(k=>(allData[k]||[]).filter(t=>t.status==='done').length);
  const chartMiss=recentDays.map(k=>(allData[k]||[]).filter(t=>t.status==='missed').length);
  const chartPend=recentDays.map(k=>(allData[k]||[]).filter(t=>t.status==='pending').length);
  if (totalAll===0) { panel.innerHTML='<div class="no-data"><i class="ti ti-chart-bar"></i>아직 기록이 없어요.</div>'; return; }
  const doneW=donePct>0?Math.max(donePct,8):0, isFull=missPct===0;
  panel.innerHTML=`
    <div class="stat-card">
      <div class="stat-card-title"><i class="ti ti-trophy"></i> 전체 누적 통계</div>
      <div class="ov-grid">
        <div class="ov-item blue"><div class="n">${totalAll}</div><div class="l">전체 할일</div></div>
        <div class="ov-item green"><div class="n">${doneAll}</div><div class="l">완료</div></div>
        <div class="ov-item coral"><div class="n">${missAll}</div><div class="l">미완료</div></div>
      </div>
      <div class="bar-labels">
        <span class="bar-lbl-done"><i class="ti ti-check" style="font-size:12px"></i> 완료율 ${donePct}%</span>
        <span class="bar-lbl-miss">미완료율 ${missPct}% <i class="ti ti-x" style="font-size:12px"></i></span>
      </div>
      <div class="bar-track">
        <div class="bar-done ${isFull?'full':''}" style="width:${doneW}%">${donePct>=15?`<span class="bar-pct">${donePct}%</span>`:''}</div>
        ${!isFull?'<div class="bar-miss"></div>':''}
      </div>
      <div class="leg-row">
        <span><span class="leg-sq" style="background:#1D9E75"></span>완료 (${doneAll}개)</span>
        <span><span class="leg-sq" style="background:#D85A30"></span>미완료 (${missAll}개)</span>
        ${totalAll-finishedAll>0?`<span><span class="leg-sq" style="background:#B5D4F4"></span>진행중 (${totalAll-finishedAll}개)</span>`:''}
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-card-title"><i class="ti ti-chart-bar"></i> 최근 ${chartLabels.length}일 현황</div>
      <div class="leg-row" style="margin-bottom:10px;">
        <span><span class="leg-sq" style="background:#1D9E75"></span>완료</span>
        <span><span class="leg-sq" style="background:#D85A30"></span>미완료</span>
        <span><span class="leg-sq" style="background:#B5D4F4"></span>진행중</span>
      </div>
      <div style="position:relative;width:100%;height:${Math.max(160,chartLabels.length*20)}px;">
        <canvas id="daily-chart" role="img" aria-label="날짜별 할 일 통계"></canvas>
      </div>
    </div>`;
  setTimeout(()=>{
    const ctx=document.getElementById('daily-chart'); if(!ctx)return;
    if(chartInst){chartInst.destroy();chartInst=null;}
    chartInst=new Chart(ctx,{type:'bar',data:{labels:chartLabels,datasets:[
      {label:'완료',data:chartDone,backgroundColor:'#1D9E75',borderRadius:6,borderSkipped:false},
      {label:'미완료',data:chartMiss,backgroundColor:'#D85A30',borderRadius:6,borderSkipped:false},
      {label:'진행중',data:chartPend,backgroundColor:'#B5D4F4',borderRadius:6,borderSkipped:false}
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{stacked:true,grid:{display:false},ticks:{color:'#888',font:{size:10},autoSkip:false,maxRotation:45}},
        y:{stacked:true,grid:{color:'rgba(0,0,0,.05)'},ticks:{color:'#888',font:{size:10},stepSize:1},beginAtZero:true}}}});
  },100);
}

window.switchTab = function(tab) {
  currentTab = tab;
  ['today','past','stats'].forEach(t=>{
    document.getElementById('panel-'+t).classList.toggle('active',t===tab);
    document.getElementById('tab-'+t).classList.toggle('active',t===tab);
  });
  if (tab==='past') renderPast();
  if (tab==='stats') renderStats();
};
</script>
</body>
</html>
